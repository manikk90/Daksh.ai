name: brain-checks

# Eval gate for Daksh Brain: specification, regressions, routing and brain validity.
# Deterministic only (no model calls, no secrets needed).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest pyyaml pillow numpy "jsonschema>=4.20,<5"
      - name: Daksh Brain architecture and contracts
        run: |
          python tools/ai_film.py validate
          python tools/daksh_architecture.py validate
          python -m pytest -q -p no:cacheprovider tests/
      - name: AI-film production and Mann regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install opencv-python-headless==4.10.0.84
          npm install --prefix "$RUNNER_TEMP/ai-film-node" --no-save playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/ai-film-node/node_modules"
          node "$RUNNER_TEMP/ai-film-node/node_modules/playwright/cli.js" install --with-deps chromium
          (cd modules/ai-film && python -m unittest discover -s tests -v)
          python -m compileall -q modules/ai-film/aifilm
      - name: Skill regression suites
        run: |
          set -e
          for d in skills/daksh skills/ai-dubbing skills/ai-music-director skills/ai-location-director skills/ai-socials skills/god-mode/scripts skills/brain-evals/scripts; do
            echo "== $d"; (cd "$d" && python -m pytest -q -p no:cacheprovider)
          done
      - name: Grader selftest
        run: python skills/brain-evals/scripts/run_evals.py selftest
      - name: Routing evals
        run: python skills/brain-evals/scripts/run_evals.py routing
      - name: Live brain valid
        run: python skills/daksh/scripts/brain.py validate brain/DAKSH_BRAIN.json > /dev/null
      - name: Skill structure
        run: |
          set -e
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] && python support_skills/skill-creator/scripts/quick_validate.py "$d"
          done
